# 기본 알림 규칙. Grafana가 이 Prometheus를 데이터소스로 알림을 평가하므로(Grafana Alerting),
# 아래 규칙은 Prometheus 자체 룰 평가용 참고 정의다(Alertmanager 미도입 — Phase 5는 컨테이너 예산상
# Grafana Alerting 단일 경로만 운영한다). Grafana 알림 규칙은
# infra/grafana/provisioning/alerting/rules.yml에서 동일한 조건으로 정의한다.
groups:
  - name: halfspace-basic
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "backend 컨테이너가 응답하지 않습니다"
          description: "prometheus가 2분 이상 backend:8080/actuator/prometheus를 스크레이프하지 못했습니다."

      - alert: HighHttp5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx 응답 비율이 5%를 초과했습니다"
          description: "최근 5분간 HTTP 5xx 비율이 5%를 초과했습니다."

      - alert: BatchJobFailure
        expr: sum by (job) (increase(halfspace_batch_job_result_total{result="failure"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "배치 잡({{ $labels.job }})이 실패했습니다"
          description: "최근 15분 이내 preview/review 생성 배치 잡에서 1건 이상의 실패가 감지되었습니다."

      - alert: FootballApiCallRateNearLimit
        # football-data.org 무료 티어 한도는 10 req/min. 순간적인 버스트로 오탐하지 않도록
        # 1분 호출률(rate*60)이 한도의 80%(8/min)를 5분 이상 지속할 때만 경고한다.
        expr: sum(rate(halfspace_football_api_calls_total[1m])) * 60 > 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "football-data API 호출량이 무료 티어 한도에 근접했습니다"
          description: "최근 5분간 football-data API 호출률이 분당 8회(무료 티어 10 req/min의 80%)를 초과해 유지되었습니다."
