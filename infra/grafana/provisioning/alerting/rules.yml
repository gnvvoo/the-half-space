apiVersion: 1

groups:
  - orgId: 1
    name: halfspace-alerts
    folder: Halfspace
    interval: 1m
    rules:
      - uid: halfspace-backend-down
        title: Backend Down
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "backend가 2분 이상 다운 상태입니다"
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: up{job="backend"}
              instant: true
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expr: ""
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: ["A"]

      - uid: halfspace-5xx-rate
        title: High 5xx Rate
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "5xx 응답 비율이 5%를 초과했습니다"
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                /
                sum(rate(http_server_requests_seconds_count[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expr: ""
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
                  operator:
                    type: and
                  query:
                    params: ["A"]

      - uid: halfspace-disk-usage
        title: Disk Usage Above 80%
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "디스크 사용량이 80%를 초과했습니다 (node-exporter 필요, infra/README 참고)"
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: |
                100 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100)
              instant: true
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expr: ""
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: ["A"]
