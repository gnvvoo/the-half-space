spring:
  application:
    name: the-half-space

  datasource:
    url: jdbc:postgresql://localhost:5432/halfspace
    username: admin
    password: 1245
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # 스케줄러로만 실행, 애플리케이션 시작 시 자동 실행 방지

cli:
  path: ./cli/football-cli
  api-key: ${FOOTBALL_DATA_API_KEY:}

football:
  api:
    base-url: https://api.football-data.org/v4
    token: ${FOOTBALL_DATA_API_KEY:}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600      # 1시간 (초)
    refresh-token-expiry: 1209600  # 14일 (초)
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  agent:
    binary-path: ./bin/football-agent