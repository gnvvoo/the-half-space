# Phase 5(관측) 설정. backend의 Actuator+Micrometer가 /actuator/prometheus로
# 지표를 노출하며, Caddy는 이 경로를 외부에 프록시하지 않는다 (infra/caddy/Caddyfile 참고).
# prometheus 컨테이너는 internal 네트워크에서 backend:8080에 직접 접근한다.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
