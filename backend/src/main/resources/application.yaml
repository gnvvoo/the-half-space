# 공통 설정 (dev/prod 공통, 환경별 값은 application-{profile}.yaml 참고)
# 기본 프로파일은 dev. 운영 배포 시 SPRING_PROFILES_ACTIVE=prod 로 오버라이드.
spring:
  application:
    name: the-half-space

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  batch:
    job:
      enabled: false  # 스케줄러로만 실행, 애플리케이션 시작 시 자동 실행 방지

cli:
  path: ${CLI_PATH:./cli/football-cli}
  api-key: ${FOOTBALL_DATA_API_KEY:}

football:
  api:
    base-url: https://api.football-data.org/v4
    token: ${FOOTBALL_DATA_API_KEY:}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 3600      # 1시간 (초)
    refresh-token-expiry: 1209600  # 14일 (초)
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  agent:
    binary-path: ${AGENT_BINARY_PATH:./bin/football-agent}
