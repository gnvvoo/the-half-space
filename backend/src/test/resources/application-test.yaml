# CI/테스트 프로파일 (SPRING_PROFILES_ACTIVE=test)
# 공통 application.yaml의 필수 플레이스홀더(JWT_SECRET 등)에 더미 값을 제공하고,
# 데이터소스는 CI의 postgres 서비스 컨테이너(환경변수) 또는 로컬 기본값을 사용한다.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/halfspace_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email, profile
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  batch:
    jdbc:
      initialize-schema: always

  flyway:
    enabled: false

app:
  jwt:
    # 테스트 전용 더미 시크릿 (HS256 최소 길이 충족, 실제 값 아님)
    secret: test-only-jwt-secret-test-only-jwt-secret-0000
